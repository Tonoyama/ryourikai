<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="350mm" height="250mm"
     viewBox="0 0 350 250"
     font-family="sans-serif">

  <!-- ===== Outer pie outline (35 x 25 cm) ===== -->
  <rect x="0" y="0" width="350" height="250"
        fill="none" stroke="black" stroke-width="0.4"/>

  <!-- ===== Braid (no-cut) edge zone, 3cm inset ===== -->
  <rect x="30" y="30" width="290" height="190"
        fill="none" stroke="#999" stroke-width="0.3"
        stroke-dasharray="2,2"/>

  <!-- ===== Vertical cut lines (full edge to edge) ===== -->
  <!-- Interior 290mm / 4 columns = 72.5mm each -->
  <line x1="102.5" y1="0" x2="102.5" y2="250"
        stroke="#d00" stroke-width="0.6"/>
  <line x1="175"   y1="0" x2="175"   y2="250"
        stroke="#d00" stroke-width="0.6"/>
  <line x1="247.5" y1="0" x2="247.5" y2="250"
        stroke="#d00" stroke-width="0.6"/>

  <!-- ===== Horizontal cut lines ===== -->
  <!-- Interior 190mm / 3 rows ~= 63.33mm each -->
  <line x1="0" y1="93.33"  x2="350" y2="93.33"
        stroke="#d00" stroke-width="0.6"/>
  <line x1="0" y1="156.67" x2="350" y2="156.67"
        stroke="#d00" stroke-width="0.6"/>

  <!-- ===== Cell numbers 1-12 ===== -->
  <g font-size="10" fill="#bbb" text-anchor="middle">
    <text x="66.25"  y="65">1</text>
    <text x="138.75" y="65">2</text>
    <text x="211.25" y="65">3</text>
    <text x="283.75" y="65">4</text>
    <text x="66.25"  y="128">5</text>
    <text x="138.75" y="128">6</text>
    <text x="211.25" y="128">7</text>
    <text x="283.75" y="128">8</text>
    <text x="66.25"  y="191">9</text>
    <text x="138.75" y="191">10</text>
    <text x="211.25" y="191">11</text>
    <text x="283.75" y="191">12</text>
  </g>

  <!-- ===== Title ===== -->
  <text x="175" y="13" font-size="5" text-anchor="middle" fill="#444">
    Raspberry Pi 12等分ガイド  |  350 x 250 mm  |  縁(ブレイド帯) 30mm  |  1ピース 72.5 x 63.3 mm
  </text>

  <!-- ===== Measurements: column widths (bottom) ===== -->
  <g font-size="2.5" fill="#666" text-anchor="middle">
    <text x="66.25"  y="247">72.5mm</text>
    <text x="138.75" y="247">72.5mm</text>
    <text x="211.25" y="247">72.5mm</text>
    <text x="283.75" y="247">72.5mm</text>
  </g>

  <!-- ===== Measurements: row heights (right side, rotated) ===== -->
  <g font-size="2.5" fill="#666" text-anchor="middle">
    <text transform="translate(346,62) rotate(90)">63.3mm</text>
    <text transform="translate(346,125) rotate(90)">63.3mm</text>
    <text transform="translate(346,188) rotate(90)">63.3mm</text>
  </g>

  <!-- ===== Cut position labels (from left edge) ===== -->
  <g font-size="2.5" fill="#a00" text-anchor="middle">
    <text x="102.5" y="3">102.5</text>
    <text x="175"   y="3">175.0</text>
    <text x="247.5" y="3">247.5</text>
  </g>

  <!-- ===== Cut position labels (from top edge) ===== -->
  <g font-size="2.5" fill="#a00" text-anchor="start">
    <text x="2" y="92.5">y=93.3</text>
    <text x="2" y="155.9">y=156.7</text>
  </g>

  <!-- ===== Corner crop marks (printing alignment) ===== -->
  <g stroke="black" stroke-width="0.3" fill="none">
    <line x1="-3" y1="0" x2="3" y2="0"/>
    <line x1="0" y1="-3" x2="0" y2="3"/>
    <line x1="347" y1="0" x2="353" y2="0"/>
    <line x1="350" y1="-3" x2="350" y2="3"/>
    <line x1="-3" y1="250" x2="3" y2="250"/>
    <line x1="0" y1="247" x2="0" y2="253"/>
    <line x1="347" y1="250" x2="353" y2="250"/>
    <line x1="350" y1="247" x2="350" y2="253"/>
  </g>

  <!-- ===== Scale calibration bar (10cm reference) ===== -->
  <g stroke="black" stroke-width="0.4">
    <line x1="20" y1="245" x2="120" y2="245"/>
    <line x1="20" y1="243" x2="20" y2="247"/>
    <line x1="120" y1="243" x2="120" y2="247"/>
    <line x1="45" y1="244" x2="45" y2="246"/>
    <line x1="70" y1="244" x2="70" y2="246"/>
    <line x1="95" y1="244" x2="95" y2="246"/>
  </g>
  <text x="70" y="240" font-size="2.5" fill="#444" text-anchor="middle">
    Scale check: this bar = 100mm (10cm)
  </text>
</svg>
